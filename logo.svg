<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qawla logo">
  <defs>
    <linearGradient id="ql-frame" x1="3" y1="3" x2="61" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d96a"/>
      <stop offset="0.5" stop-color="#00a854"/>
      <stop offset="1" stop-color="#007a3d"/>
    </linearGradient>
    <linearGradient id="ql-bg" x1="7" y1="7" x2="7" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8faff"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded-square frame (pitch green) -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#ql-frame)"/>
  <!-- Light interior (cream/white) -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="12" fill="url(#ql-bg)"/>
  <!-- Inner border line for depth -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="12" fill="none" stroke="#00d96a" stroke-width="0.5" opacity="0.15"/>
  <!-- Top edge highlight -->
  <rect x="6.5" y="6.5" width="51" height="2" rx="1" fill="#00a854" opacity="0.08"/>
  <!-- The letter Q (typographic, deep pitch green) -->
  <text x="32" y="44" text-anchor="middle" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="40" font-weight="800" fill="#007a3d">Q</text>
</svg>
